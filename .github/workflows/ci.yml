name: AI Quality & Regression CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated pytest regression suite
      run: |
        python -m pytest -v

    - name: Generate AI Quality JSON and HTML reports
      run: |
        python -m app.report

    - name: Upload HTML & JSON Evaluation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-quality-reports
        path: reports/